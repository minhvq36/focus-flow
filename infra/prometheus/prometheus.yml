global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'focusflow-monitor'

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files:
  # - "alert_rules.yml"

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'focusflow-api'
    static_configs:
      - targets: ['localhost:8080']
    metrics_path: '/metrics'

  - job_name: 'redis'
    static_configs:
      - targets: ['localhost:6379']

  - job_name: 'elasticsearch'
    static_configs:
      - targets: ['localhost:9200']
