version: '3'

tasks:
  # Frontend tasks
  frontend:build:
    desc: Build frontend for production
    dir: frontend
    cmds:
      - npm run build

  frontend:dev:
    desc: Start frontend development server
    dir: frontend
    cmds:
      - npm run dev

  frontend:lint:
    desc: Run ESLint on frontend
    dir: frontend
    cmds:
      - npm run lint

  frontend:type-check:
    desc: Run TypeScript type checking
    dir: frontend
    cmds:
      - npm run type-check

  # Backend tasks
  backend:build:
    desc: Build backend binary
    dir: backend
    cmds:
      - go build -o bin/server ./cmd/server

  backend:run:
    desc: Run backend server
    dir: backend
    cmds:
      - go run ./cmd/server

  backend:lint:
    desc: Run Go linter
    dir: backend
    cmds:
      - go vet ./...

  backend:test:
    desc: Run backend tests
    dir: backend
    cmds:
      - go test -v ./...

  # Infrastructure tasks
  infra:up:
    desc: Start infrastructure with Docker Compose
    dir: infra
    cmds:
      - docker-compose up -d

  infra:down:
    desc: Stop infrastructure
    dir: infra
    cmds:
      - docker-compose down

  infra:logs:
    desc: View infrastructure logs
    dir: infra
    cmds:
      - docker-compose logs -f

  # Development tasks
  dev:setup:
    desc: Setup development environment
    cmds:
      - task: infra:up
      - task: frontend:build
      - task: backend:build

  dev:start:
    desc: Start all services for development
    cmds:
      - task: infra:up
      - task: backend:run &
      - task: frontend:dev

  # CI/CD tasks
  ci:test:
    desc: Run all tests
    cmds:
      - task: frontend:lint
      - task: frontend:type-check
      - task: backend:lint
      - task: backend:test

  ci:build:
    desc: Build all services
    cmds:
      - task: frontend:build
      - task: backend:build

  ci:docker:
    desc: Build Docker image
    dir: backend
    cmds:
      - docker build -t focusflow-api:latest .
